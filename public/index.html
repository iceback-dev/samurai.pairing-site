    }
    .form-group label {
      font-size: 14px;
      color: #bbb;
      display: block;
      margin-bottom: 6px;
    }
    .form-group .input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .form-group input {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 40px;
      padding: 14px 20px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
      min-width: 180px;
    }
    .form-group input:focus {
      border-color: #f57c00;
    }
    .form-group button {
      background: #f57c00;
      border: none;
      border-radius: 40px;

      cursor: pointer;
      transition: 0.2s;

    }
    .form-group button:hover {
      background: #ff9800;
      transform: scale(1.02);

    .form-group button:disabled {
      opacity: 0.5;

    .logs {
      background: #111;

    .logs .log-entry.error { color: #f44336; }
    .logs .log-entry.code { color: #ffb300; font-weight: 700; font-size: 18px; }
    .logs .log-entry.connected { color: #2196f3; }
    .logs .log-entry.info { color: #aaa; }
    .logs::-webkit-scrollbar { width: 6px; }
    .logs::-webkit-scrollbar-track { background: #1a1a1a; }
    .logs::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 18px 0 12px;

    }

      color: #ddd;
      font-size: 14px;
      border: 1px solid #2a2a2a;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;

    .links a:hover {

    }

    }
    .footer {

    .footer a {

    }
    .footer a:hover {

    }
    .status-badge {
      display: inline-block;
      background: #1f1f1f;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      margin-top: 6px;
    }
    .status-badge.online { background: #1b5e20; color: #a5d6a7; }
    .status-badge.offline { background: #4a1a1a; color: #ef9a9a; }

<body>
<div class="container">
  <div class="header">
    <img src="https://files.catbox.moe/t2qrr5.png" alt="Samurai Bot" />
    <div>
      <h1>SAMURAI PAIR</h1>
      <small>SECURE PAIRING GATEWAY</small>
    </div>
  </div>

  <div class="badge">🔐 PAIR YOUR WHATSAPP</div>

  <div class="form-group">
    <label for="phone">📞 Enter your WhatsApp number (without + or country code)</label>
    <div class="input-row">
      <input type="tel" id="phone" placeholder="263788848481" value="263788848481" />
      <button id="pairBtn">GENERATE CODE</button>
    </div>
    <div style="margin-top: 10px; font-size: 13px; color: #888;">
      <span>🇿🇼 Zimbabwe</span> · <span id="statusText" class="status-badge offline">OFFLINE</span>
    </div>
  </div>

  <div class="logs" id="logContainer">
    <div class="log-entry info">⏳ Waiting for pairing request...</div>
  </div>

  <div class="links">
    <a href="https://whatsapp.com/channel/0029Vb7rXVkBfxo5urtLHd1P" target="_blank">
      <span class="icon">📢</span> Iceback Updates
    </a>
    <a href="https://whatsapp.com/channel/0029Vb9ayRp6xCSX3gMk1g0i" target="_blank">
      <span class="icon">💎</span> Hunter Devs
    </a>
  </div>

  <div class="footer">
    Made with ❤️ by <a href="https://t.me/icebackmaster11" target="_blank">Hunter Devs</a> · 
    <span id="contactOwner" style="cursor:pointer; color:#f57c00;" onclick="window.open('https://t.me/icebackmaster11','_blank')">Contact Owner</span>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const logContainer = document.getElementById('logContainer');
  const pairBtn = document.getElementById('pairBtn');
  const phoneInput = document.getElementById('phone');
  const statusText = document.getElementById('statusText');

  function addLog(message, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = message;
    logContainer.appendChild(entry);
    logContainer.scrollTop = logContainer.scrollHeight;
  }

  // Clear logs and add initial
  function resetLogs() {
    logContainer.innerHTML = '';
    addLog('🔄 Ready to pair. Enter your number and click GENERATE CODE.', 'info');
  }

  socket.on('log', (data) => {
    const { message, type } = data;
    addLog(message, type || 'info');
    if (type === 'connected') {
      statusText.textContent = '🟢 ONLINE';
      statusText.className = 'status-badge online';
      pairBtn.disabled = false;
    } else if (type === 'error') {
      pairBtn.disabled = false;
      statusText.textContent = '🔴 ERROR';
      statusText.className = 'status-badge offline';
    } else if (type === 'code') {
      // Highlight the code
      addLog('─────────────────────────', 'info');
      addLog(`🔑 PAIRING CODE: ${message.replace('✅ Pairing code: ', '')}`, 'code');
      addLog('─────────────────────────', 'info');
    }
  });

  pairBtn.addEventListener('click', () => {
    const phone = phoneInput.value.trim().replace(/\D/g, '');
    if (!phone || phone.length < 7 || phone.length > 15) {
      addLog('❌ Please enter a valid phone number (digits only).', 'error');
      return;
    }
    pairBtn.disabled = true;
    statusText.textContent = '⏳ PAIRING...';
    statusText.className = 'status-badge offline';
    resetLogs();
    addLog(`📞 Requesting pairing for +${phone}...`, 'info');
    socket.emit('pair', { phone });
  });

  // Re-enable button if socket disconnects
  socket.on('disconnect', () => {
    pairBtn.disabled = false;
    addLog('⚠️ Connection to server lost. Please refresh.', 'error');
  });

  // Initial status
  resetLogs();
</script>
</body>
